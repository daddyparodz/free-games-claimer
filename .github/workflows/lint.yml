# https://github.com/marketplace/actions/super-linter#get-started
name: Lint

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions: {}

jobs:
  lint:
    name: Lint
    if: >-
      github.actor_id == '45983094' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    container: node:24-bookworm

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Clear ambient checkout credentials
        shell: bash
        run: |
          unset GITHUB_TOKEN GH_TOKEN
          printf '%s\n' 'GITHUB_TOKEN=' 'GH_TOKEN=' >> "$GITHUB_ENV"

      - name: Super-linter
        uses: super-linter/super-linter/slim@47984f49b4e87383eed97890fe2dca6063bbd9c3 # v8.3.1
        # TODO need to create problem matchers for each linter? https://github.com/rhysd/actionlint/blob/v1.7.7/docs/usage.md#problem-matchers
        env:
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: 'true'
          MULTI_STATUS: 'false'
          # The pinned Super-linter uses a legacy YAML config, including JSON rules.
          ESLINT_USE_FLAT_CONFIG: 'false'
          # Standard forbids the semicolons and trailing commas required by our
          # existing ESLint and Prettier rules. Keep those canonical style checks;
          # leave all other default lint, security, format and clone checks on.
          VALIDATE_JAVASCRIPT_STANDARD: 'false'
  # TODO automatically fix linting issues and commit them for PRs
  # fix-lint-issues: # https://github.com/marketplace/actions/super-linter#github-actions-workflow-example-pull-request
